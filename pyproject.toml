[project]
name = "tinypy"
version = "0.1.0"
description = "A toy version of Python, written in Python..."
readme = "README.md"
authors = [
    { name = "James Parsloe", email = "jamesparsloe@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
tinypy = "tinypy:main"
tokenize = "tinypy.tokenizer:main"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0.1",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = ["examples/"]

[tool.ruff.lint]
extend-ignore = ["E402"]
