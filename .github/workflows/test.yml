name: Test
on:
  push:
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install tinypy
        run: uv sync --all-extras --dev

      - name: Tests
        run: uv run pytest

      - name: REPL tests
        run: chmod +x test.sh && ./test.sh

      - name: Benchmarks
        run: chmod +x benchmark.sh && ./benchmark.sh
